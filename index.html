<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#e71d25">
  <title>Mixue Sch — Penjadwal Shift</title>
  <meta name="description" content="Aplikasi pembuat jadwal shift otomatis: Pagi, Siang, Middle, Kasir, Piket dan libur rolling.">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <noscript>Aplikasi ini membutuhkan JavaScript.</noscript>
  <div id="app"></div>
  <div id="nav" class="tabbar" hidden></div>
  <div id="splash" aria-hidden="true"><div class="sp-in"><img class="sp-logo" src="img/mixue-logo.jpg" alt="Mixue"></div></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <script>setTimeout(function(){var s=document.getElementById("splash");if(s){s.classList.add("out");setTimeout(function(){if(s.parentNode)s.parentNode.removeChild(s)},700)}},1900)</script>
  <script src="js/scheduler.js"></script>
  <script src="js/xlsx.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
