name: Build & Release APK

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag rilis (mis. v1.0.1)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Tes jadwal
        run: node --test test/scheduler.test.js

      - name: Pasang dependensi
        run: npm install --no-audit --no-fund

      - name: Siapkan proyek Android
        run: |
          npm run build:web
          npx cap add android
          npx cap sync android

      - name: Set versi aplikasi
        run: |
          VERSION="${TAG#v}"
          sed -i "s/versionCode 1/versionCode ${GITHUB_RUN_NUMBER}/; s/versionName \"1.0\"/versionName \"${VERSION}\"/" android/app/build.gradle
          grep -nE "versionCode|versionName" android/app/build.gradle

      - name: Build APK (release, belum ditandatangani)
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Zipalign & tanda tangan APK
        run: |
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          SRC="$(find android/app/build/outputs/apk/release -name '*.apk' | head -1)"
          echo "Build-tools: $BT"; echo "APK mentah: $SRC"
          mkdir -p dist
          "$BT/zipalign" -f -p 4 "$SRC" dist/aligned.apk
          "$BT/apksigner" sign --ks signing/mixue-sch.jks --ks-pass pass:mixuesch --key-pass pass:mixuesch \
            --out "dist/Mixue-Sch-${TAG}.apk" dist/aligned.apk
          "$BT/apksigner" verify --verbose "dist/Mixue-Sch-${TAG}.apk"
          rm -f dist/aligned.apk dist/*.idsig
          ls -la dist

      - name: Unggah artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mixue-Sch-${{ env.TAG }}
          path: dist/*.apk

      - name: Publikasikan ke GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK="dist/Mixue-Sch-${TAG}.apk"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber
          else
            gh release create "$TAG" "$APK" --target "${GITHUB_SHA}" --title "Mixue Sch ${TAG}" \
              --notes "APK Android Mixue Sch ${TAG}. Unduh file .apk di bawah, buka di HP, izinkan instal dari sumber tidak dikenal bila diminta."
          fi
