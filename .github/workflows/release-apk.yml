name: Build & Release APK

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'css/**'
      - 'js/**'
      - 'runners/**'
      - 'img/**'
      - 'scripts/**'
      - 'package.json'
      - 'capacitor.config.json'
      - '.github/workflows/release-apk.yml'
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag rilis (mis. v1.0.1)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      TAG: ${{ github.event.inputs.tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || format('v1.0.{0}', github.run_number) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Tes
        run: node --test test/scheduler.test.js test/sync.test.js test/runner.test.js

      - name: Pasang dependensi
        run: npm install --no-audit --no-fund

      - name: Bangun Mixue Penguasa (admin)
        run: bash scripts/build-apk.sh admin "$TAG" "$GITHUB_RUN_NUMBER"

      - name: Bangun Mixue Rakyat (penerima)
        run: bash scripts/build-apk.sh viewer "$TAG" "$GITHUB_RUN_NUMBER"

      - name: Unggah artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mixue-APK-${{ env.TAG }}
          path: dist/*.apk

      - name: Publikasikan ke GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la dist
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.apk --clobber
          else
            gh release create "$TAG" dist/*.apk --target "${GITHUB_SHA}" --title "Mixue ${TAG}" \
              --notes "Dua aplikasi: Mixue Penguasa (admin, membuat jadwal) dan Mixue Rakyat (penerima, jadwal otomatis ikut berubah). Unduh .apk di bawah."
          fi
